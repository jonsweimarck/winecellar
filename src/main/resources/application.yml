spring:
  application:
    name: winecellar
  thymeleaf:
    cache: false
  datasource:
    # POSTGRESQL_ADDON_* sätts automatiskt av Clever Cloud när Postgres-tillägget
    # länkas till appen. Utan dem (lokalt, docker-compose) gäller samma värden
    # som docker-compose.yml.
    url: jdbc:postgresql://${POSTGRESQL_ADDON_HOST:localhost}:${POSTGRESQL_ADDON_PORT:5432}/${POSTGRESQL_ADDON_DB:winecellar}
    username: ${POSTGRESQL_ADDON_USER:winecellar}
    password: ${POSTGRESQL_ADDON_PASSWORD:winecellar}
    hikari:
      # Clever Clouds DEV-nivå av Postgres har ett lågt anslutningstak, se
      # CLAUDE.md - samma fälla som roombooking redan stötte på.
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    # Låter schema.sql köras EFTER att Hibernate skapat/uppdaterat tabellerna,
    # inte innan - annars kraschar schema.sql:s ALTER TABLE mot en wines-tabell
    # som ännu inte finns (t.ex. mot en helt ny, tom databas).
    defer-datasource-initialization: true
  sql:
    init:
      # Standard är "embedded" (körs bara mot in-memory-databaser som H2) -
      # måste sättas explicit till "always" för att köras mot vår riktiga
      # Postgres också. Se schema.sql för vad som faktiskt körs.
      mode: always
      # Spring delar upp schema.sql i separata JDBC-anrop genom att söka
      # efter den här strängen - standardvärdet "; " funkar inte här sedan
      # 2026-07-25, då search_vector-triggerns PL/pgSQL-funktionskropp
      # (CREATE FUNCTION ... AS $$ ... $$) fick ett vanligt "return new;"
      # med ett eget ";" inuti, vilket den enkla uppdelningen inte förstår
      # (den är ingen riktig SQL-parser, bara en strängsökning) - filen
      # kraschade mitt i funktionsdefinitionen. ";;" som separator löser
      # det: varje toppnivåsats i schema.sql avslutas nu med ";;" istället
      # för ";", medan enstaka ";" inuti funktionskroppen lämnas orörda.
      separator: ";;"
  servlet:
    multipart:
      # Höjt från 5MB (WINE-24, se ADR 0014/CLAUDE.md) - bulkimportens
      # bildmapp kan innehålla ~100 foton i EN request, inte bara ett
      # enda foto som tidigare var det enda multipart-scenariot.
      # max-file-size skyddar fortfarande mot en orimligt stor enskild
      # fil även om klientsidans nedskalning (se import.html) av någon
      # anledning inte kört (t.ex. JS avstängt).
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  # Clever Cloud terminerar TLS i en framförliggande reverse proxy/load
  # balancer och skickar vanlig HTTP internt till appen, med det ursprungliga
  # protokollet signalerat via X-Forwarded-Proto (bekräftat av Clever Clouds
  # egen dokumentation, se ADR 0020 och CLAUDE.md, Kända fällor - WINE-43).
  # Utan detta uppfattar appen aldrig anropet som krypterat, så Spring
  # Securitys Secure-cookieflagga sätts aldrig trots att den faktiska
  # besökaren använder HTTPS. "framework" använder Spring Framework/
  # spring-webs ForwardedHeaderFilter (inte Spring Security, trots
  # namnlikheten). Bekräftat via automatiskt test (ForwardedHeadersIT,
  # WINE-43) att detta räcker för remember-me-cookien - men INTE för den
  # vanliga sessionscookien (JSESSIONID), som Tomcat skriver via sin egen,
  # interna request-hantering, utanför ForwardedHeaderFilter-wrappern.
  # Sessionscookien tvingas därför säker separat, bara i produktion, via
  # application-prod.yml - se den filen och CLAUDE.md, Kända fällor.
  # Samma filter läser även X-Forwarded-Host/-Port/-Prefix utan
  # källbegränsning, vilket i teorin kan påverka omdirigeringsmålet efter
  # inloggning - en separat, medvetet accepterad risk, se ADR 0020.
  forward-headers-strategy: framework

winecellar:
  anthropic:
    # Tom standard lokalt - etikettskanning (WINE-5) fungerar inte utan en
    # riktig nyckel, men appen ska ändå starta (AnthropicLabelInterpreter
    # instansieras alltid, anropet mot Anthropic sker bara när skanningen
    # faktiskt används).
    api-key: ${WINECELLAR_ANTHROPIC_API_KEY:}
    model: ${WINECELLAR_ANTHROPIC_MODEL:claude-sonnet-5}
  remember-me:
    # Signerar "håll mig inloggad"-cookien (WINE-40, se ADR 0020). Tom
    # standard, INTE en hårdkodad utvecklingssträng (fixat i kodgranskning) -
    # till skillnad från t.ex. WINECELLAR_ANTHROPIC_API_KEY duger inte en
    # känd/förutsägbar sträng här som en "ofarlig" lokal default, eftersom
    # den fortfarande går att signera en giltig, förfalskad cookie med. Är
    # nyckeln tom registrerar SecurityConfig inte remember-me-stödet alls -
    # kryssrutan blir overksam lokalt om variabeln inte satts, hellre än
    # osäker. Produktion MÅSTE sätta en egen hemlighet via miljövariabeln.
    key: ${WINECELLAR_REMEMBER_ME_KEY:}

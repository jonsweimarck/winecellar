<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logga in - Vinkällaren</title>
    <th:block th:replace="~{fragments/tema :: tema}"></th:block>
    <th:block th:replace="~{fragments/inloggningsstil :: inloggningsstil}"></th:block>
</head>
<body>
    <main class="inloggningssida">
        <h1 class="apptitel">Vinkällaren</h1>

        <!-- Formuläret ligger UTANFÖR kortet, inte inuti: fältens
             skiljelinjer styrs av att de är kortets direkta barn (se
             .kort > .falt i tema.css), och ett mellanliggande <form>
             hade brutit den relationen. Samma struktur som
             vinformuläret. -->
        <form method="post" th:action="@{/login}">
            <div class="kort">
                <label class="falt"><span>Användarnamn</span>
                    <input type="text" id="username" name="username" autocomplete="username" autofocus="autofocus">
                </label>
                <label class="falt"><span>Lösenord</span>
                    <input type="password" id="password" name="password" autocomplete="current-password">
                </label>
                <div class="falt">
                    <button type="submit" class="knapp-bred">Logga in</button>
                </div>
            </div>
        </form>

        <p class="fel" th:if="${param.error}">Fel användarnamn eller lösenord.</p>
        <p class="info" th:if="${param.logout}">Du är utloggad.</p>

        <p class="lank"><a th:href="@{/registrera}">Inget konto än? Registrera dig</a></p>
    </main>
</body>
</html>

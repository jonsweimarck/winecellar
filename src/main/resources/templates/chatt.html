<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${conversation.title} + ' - Vinkällaren'"></title>
    <th:block th:replace="~{fragments/tema :: tema}"></th:block>
    <script th:src="@{/js/vantestatus.js}" defer></script>
    <style>
        body { max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
        dialog p { margin: 0 0 1rem; }

        .fel { color: var(--fel); }
        .knapp-bred { width: 100%; box-sizing: border-box; }
        .radera-kort { margin-top: 2rem; }
        .farlig-zon-text { margin: 0 0 0.75rem; color: var(--text-dampad); }

        .meddelanden { display: flex; flex-direction: column; gap: 0.75rem; margin: 1.5rem 0; }
        .meddelande { padding: 0.75rem 1rem; border-radius: var(--radie); max-width: 85%; overflow-wrap: anywhere; }
        .meddelande-user { align-self: flex-end; background: var(--accent); color: var(--pa-accent); }
        .meddelande-assistant { align-self: flex-start; background: var(--yta-2); border: 1px solid var(--ram-stark); }

        /* Användarens EGNA meddelanden är ren text (aldrig markdown-tolkade,
           se ChatMarkdownRenderer) - white-space: pre-wrap bevarar radbrytningar
           användaren själv skrev in. Scopeat hit (inte på .meddelande) eftersom
           assistentsvarets riktiga HTML-element (nedan) redan hanterar sina
           egna radbrytningar - pre-wrap hade bara gjort whitespace mellan
           block-element (<p>, <ul>, ...) i den genererade HTML:en synligt som
           extra, oavsiktliga blankrader. */
        .meddelande-text { white-space: pre-wrap; }

        /* Assistentsvarets markdown-till-HTML-innehåll (WINE-53) - egna
           marginaler/typografi för rubriker/listor/kod, smala nog att inte
           göra bubblan onödigt hög, och skalade för att fungera lika bra i
           en 85%-bred bubbla på både dator och mobil (se .meddelande ovan). */
        .meddelande-innehall > :first-child { margin-top: 0; }
        .meddelande-innehall > :last-child { margin-bottom: 0; }
        .meddelande-innehall p { margin: 0.5rem 0; }
        .meddelande-innehall h1, .meddelande-innehall h2, .meddelande-innehall h3 {
            margin: 0.75rem 0 0.35rem; font-size: 1.05rem;
        }
        .meddelande-innehall ul, .meddelande-innehall ol { margin: 0.5rem 0; padding-left: 1.3rem; }
        .meddelande-innehall li { margin: 0.2rem 0; }
        .meddelande-innehall blockquote {
            margin: 0.5rem 0; padding-left: 0.75rem;
            border-left: 3px solid var(--ram-stark); color: var(--text-dampad);
        }
        .meddelande-innehall pre {
            margin: 0.5rem 0; padding: 0.6rem; overflow-x: auto;
            background: var(--yta-3); border-radius: var(--radie);
        }
        .meddelande-innehall code {
            padding: 0.1rem 0.3rem; background: var(--yta-3);
            border-radius: 0.25rem; font-size: 0.85em; overflow-wrap: anywhere;
        }
        .meddelande-innehall pre code { padding: 0; background: none; }
        .meddelande-innehall a { color: inherit; }

        .nytt-meddelande textarea {
            width: 100%; box-sizing: border-box; min-height: 3.5rem; resize: vertical; font: inherit;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/topprad :: topprad(${conversation.title}, '/chatt')}"></div>

    <p class="fel" th:if="${fel != null}" th:text="${fel}"></p>

    <div class="meddelanden">
        <div th:each="meddelande : ${messages}"
             th:class="${meddelande.role().name() == 'USER'} ? 'meddelande meddelande-user' : 'meddelande meddelande-assistant'">
            <!-- Användarens egna meddelanden är ren text (th:text, escapad) -
                 assistentens svar är förtolkad, sanerad markdown-HTML
                 (ChatController/ChatMarkdownRenderer, WINE-53), th:utext. -->
            <span th:if="${meddelande.role().name() == 'USER'}"
                  class="meddelande-text"
                  th:text="${meddelande.content}"></span>
            <div th:unless="${meddelande.role().name() == 'USER'}"
                 class="meddelande-innehall"
                 th:utext="${meddelande.html}"></div>
        </div>
    </div>

    <form method="post" th:action="@{/chatt/{id}/meddelande(id=${conversation.id.value})}" class="nytt-meddelande">
        <div class="kort">
            <div class="falt">
                <textarea name="message" placeholder="Skriv ett meddelande..." required></textarea>
            </div>
            <div class="falt">
                <button type="submit" class="knapp-bred">Skicka</button>
            </div>
        </div>
        <p id="nytt-meddelande-status" class="statusrad"></p>
    </form>

    <!-- Samma "Farlig zon"-mönster som vin-formular.html (WINE-44): en
         <dialog>-bekräftelse, inte window.confirm() (blockeras av vissa
         webbläsarinställningar, se CLAUDE.md). -->
    <div class="kort radera-kort">
        <div class="falt">
            <p class="farlig-zon-text">Radera konversationen permanent. Går inte att ångra.</p>
            <button type="button" id="oppna-radera-dialog" class="knapp-farlig">Radera konversationen</button>
        </div>
    </div>

    <dialog id="radera-dialog">
        <form method="post" th:action="@{/chatt/{id}/radera(id=${conversation.id.value})}">
            <p>Radera konversationen <strong th:text="${conversation.title}"></strong> permanent? Det går inte att ångra.</p>
            <div class="atgardsrad">
                <button type="submit" class="knapp-farlig">Ja, radera konversationen</button>
                <button type="button" id="stang-radera-dialog" class="knapp-sekundar">Avbryt</button>
            </div>
        </form>
    </dialog>

    <script>
        (function () {
            var öppnaKnapp = document.getElementById('oppna-radera-dialog');
            var dialogruta = document.getElementById('radera-dialog');
            var avbrytKnapp = document.getElementById('stang-radera-dialog');
            if (!öppnaKnapp || !dialogruta) {
                return;
            }
            öppnaKnapp.addEventListener('click', function () {
                dialogruta.showModal();
            });
            if (avbrytKnapp) {
                avbrytKnapp.addEventListener('click', function () {
                    dialogruta.close();
                });
            }
        })();

        // Väntefeedback (WINE-49) - se motsvarande kommentar i
        // chatt-lista.html. Ett skickat meddelande gör en vanlig
        // sidnavigering som väntar in hela LLM-anropet innan svaret kommer
        // tillbaka som en ny sida.
        (function () {
            var form = document.querySelector('.nytt-meddelande');
            if (!form) {
                return;
            }
            var statusRad = document.getElementById('nytt-meddelande-status');
            var knapp = form.querySelector('button[type=submit]');
            form.addEventListener('submit', function () {
                // Punkterna cyklar 1-2-3 i evighet (WINE-54, vantestatus.js)
                // så statusraden inte ser frusen ut under väntetiden.
                if (statusRad) {
                    window.winecellarVäntestatus.starta(statusRad, 'Skickar meddelande, väntar på svar');
                }
                if (knapp) {
                    knapp.disabled = true;
                }
            });
        })();
    </script>
</body>
</html>

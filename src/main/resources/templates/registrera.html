<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrera konto - Vinkällaren</title>
    <th:block th:replace="~{fragments/tema :: tema}"></th:block>
    <th:block th:replace="~{fragments/inloggningsstil :: inloggningsstil}"></th:block>
</head>
<body>
    <main class="inloggningssida">
        <h1 class="apptitel">Vinkällaren</h1>

        <!-- Formuläret ligger utanför kortet, se kommentaren i
             login.html. -->
        <form method="post" th:action="@{/registrera}">
            <div class="kort">
                <label class="falt"><span>E-postadress</span>
                    <input type="text" id="username" name="username" th:value="${username}"
                           autocomplete="email" inputmode="email" autofocus="autofocus">
                </label>
                <div class="falt">
                    <button type="submit" class="knapp-bred">Skicka verifieringslänk</button>
                </div>
            </div>
            <!-- Honeypot (WINE-65): dolt för människor (utanför bild, ur tabbordningen och för
                 skärmläsare), men en enkel bot som fyller i alla fält avslöjar sig. Ligger utanför
                 .kort så att det inte påverkar kortets fält-stilar. -->
            <div aria-hidden="true" style="position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden;">
                <label>Lämna detta fält tomt
                    <input type="text" name="kampanjref" tabindex="-1" autocomplete="off" value="">
                </label>
            </div>
        </form>

        <p class="info">Vi mejlar en länk där du bekräftar din e-postadress och väljer ditt lösenord.</p>
        <p class="fel" th:if="${error}" th:text="${error}"></p>

        <p class="lank"><a th:href="@{/login}">Har du redan ett konto? Logga in</a></p>
    </main>
</body>
</html>

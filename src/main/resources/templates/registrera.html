<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrera konto - Vinkällaren</title>
    <th:block th:replace="~{fragments/tema :: tema}"></th:block>
    <th:block th:replace="~{fragments/inloggningsstil :: inloggningsstil}"></th:block>
</head>
<body>
    <main class="inloggningssida">
        <h1 class="apptitel">Vinkällaren</h1>

        <!-- Formuläret ligger utanför kortet, se kommentaren i
             login.html. -->
        <form method="post" th:action="@{/registrera}">
            <div class="kort">
                <label class="falt"><span>Användarnamn</span>
                    <input type="text" id="username" name="username" th:value="${username}"
                           autocomplete="username" autofocus="autofocus">
                </label>
                <label class="falt"><span>Lösenord</span>
                    <input type="password" id="password" name="password" autocomplete="new-password">
                </label>
                <label class="falt"><span>Bekräfta lösenord</span>
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
                </label>
                <div class="falt">
                    <button type="submit" class="knapp-bred">Registrera</button>
                </div>
            </div>
        </form>

        <p class="fel" th:if="${error}" th:text="${error}"></p>

        <p class="lank"><a th:href="@{/login}">Har du redan ett konto? Logga in</a></p>
    </main>
</body>
</html>

<!--
    Delat fragment för sidhuvudet: apptitel till vänster, och antingen en
    tillbaka-pil (till `tillbakaLank`) eller en kugghjulslänk till
    /installningar till höger - aldrig båda. Alla inloggade sidor (utom
    login/registrera, som inte har någon inställningssida att länka till)
    använder samma fragment, så kugghjulet inte glöms bort på en enskild
    sida när fler sidor läggs till.

    CSS:en för `.topprad*` duplicerar sig i varje anropande sidas egen
    <style>-block (samma mönster som `.knapp` redan gör där) - det finns
    ännu ingen delad static/css-fil i projektet. Känd förenkling, se
    diskussionen om ett gemensamt designsystem i CLAUDE.md.
-->
<div th:fragment="topprad(titel, tillbakaLank)" class="topprad">
    <a th:if="${tillbakaLank != null}" th:href="${tillbakaLank}" class="topprad-ikonlank" aria-label="Tillbaka" title="Tillbaka">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
        </svg>
    </a>
    <h1 class="topprad-titel" th:text="${titel}"></h1>
    <a th:if="${tillbakaLank == null}" th:href="@{/installningar}" class="topprad-ikonlank" aria-label="Inställningar" title="Inställningar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>

        </svg>
    </a>
</div>

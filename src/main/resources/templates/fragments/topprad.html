<!--
    Delat fragment för sidhuvudet: apptitel till vänster, och antingen en
    tillbaka-pil (till `tillbakaLank`) eller en hamburgarmeny till höger -
    aldrig båda. Alla inloggade sidor (utom login/registrera, som inte har
    någon meny att länka från) använder samma fragment, så menyn inte
    glöms bort på en enskild sida när fler sidor läggs till.

    Menyn (WINE-48, ersatte en direkt kugghjulslänk till /installningar)
    samlar Inställningar och den nya AI-chatten - ett <details>/<summary>
    utan egen JS, se tema.css:s kommentar om varför.

    CSS:en för `.topprad*` ligger i static/css/tema.css (ADR 0019) -
    delad av alla anropande sidor, inte duplicerad per sida.
-->
<div th:fragment="topprad(titel, tillbakaLank)" class="topprad">
    <a th:if="${tillbakaLank != null}" th:href="${tillbakaLank}" class="topprad-ikonlank" aria-label="Tillbaka" title="Tillbaka">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
        </svg>
    </a>
    <h1 class="topprad-titel" th:text="${titel}"></h1>
    <details th:if="${tillbakaLank == null}" class="topprad-meny">
        <summary class="topprad-ikonlank" aria-label="Meny" title="Meny">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 18h16"></path>
            </svg>
        </summary>
        <div class="topprad-meny-innehall">
            <a th:href="@{/chatt}">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                <span>Chatta om dina viner</span>
            </a>
            <a th:href="@{/installningar}">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>Inställningar</span>
            </a>
        </div>
    </details>
</div>

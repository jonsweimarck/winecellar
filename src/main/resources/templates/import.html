<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Importera vinlista - Vinkällaren</title>
    <th:block th:replace="~{fragments/tema :: tema}"></th:block>
    <script th:src="@{/js/validering.js}" defer></script>
    <style>
        body { max-width: 32rem; margin: 4rem auto; padding: 0 1rem; }
        .fel { color: var(--fel); margin-top: 1rem; }
        .status { color: var(--text-dampad); margin-top: 0.5rem; font-size: 0.9rem; }
        .sammanfattning { margin-top: 1.5rem; border: 1px solid var(--ram); border-radius: var(--radie);
            padding: 1rem; background: var(--yta-2); }
        /* Etikett och siffra som EN textrad ("Rader totalt: 8"), inte
           en tvåkolumnstabell - enklare att läsa i ett litet
           sammandrag som bara har tre rader. */
        .sammanfattning p { margin: 0 0 0.4rem; }
        .sammanfattning p:last-of-type { margin-bottom: 0; }
        /* Rubriken över fellistan är villkorlig (th:if) - visas bara
           när det faktiskt finns fel. .sektionsrubrik är samma
           dämpade, versala stil som Inställningar redan använder för
           sina sektionsrubriker (Data/Utseende/Konto) - ingen ny
           rubrikstil uppfunnen för det här enda stället. */
        .sammanfattning .sektionsrubrik { margin-top: 1.25rem; }
        select { margin-top: 0.3rem; }
        .lank { margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/topprad :: topprad('Importera vinlista', '/installningar')}"></div>

    <p class="fel" th:if="${error}" th:text="${error}"></p>

    <div th:if="${preview == null and result == null}">
        <form method="post" th:action="@{/import}" enctype="multipart/form-data">
            <div class="kort">
                <!-- <div>, inte <label>: knapparna nedan ÄR <label>, och
                     en label får inte ligga inuti en annan. Samma
                     mönster som etikettfältet i vin-formular.html. -->
                <div class="falt"><span>Excel-fil (.xlsx)</span>
                    <div class="filval">
                        <input type="file" id="fil-input" name="fil" accept=".xlsx" required="required">
                        <label for="fil-input" class="knapp knapp-sekundar">Välj fil</label>
                        <span class="filval-namn" id="fil-namn">Ingen fil vald</span>
                    </div>
                </div>
                <div class="falt"><span>Bildmapp (valfri)</span>
                    <div class="filval">
                        <input type="file" id="bilder-input" name="bilder"
                               webkitdirectory="webkitdirectory" multiple="multiple">
                        <label for="bilder-input" class="knapp knapp-sekundar">Välj mapp</label>
                        <span class="filval-namn" id="bilder-namn">Ingen mapp vald</span>
                    </div>
                    <p class="status" id="bilder-status"></p>
                </div>
            </div>

            <div class="atgardsrad">
                <button type="submit" id="import-submit">Förhandsgranska</button>
            </div>
        </form>
    </div>

    <div class="sammanfattning" th:if="${preview != null}">
        <p th:text="|Rader totalt: ${preview.totalRows()}|"></p>
        <p th:text="|Rader som inte kan importeras: ${preview.issues().size()}|"></p>
        <p th:text="|Nya viner: ${preview.clean()}|"></p>

        <!-- Rubriken visas bara när det faktiskt finns fel - en tom
             lista renderar varken rubrik eller punktlista. -->
        <p class="sektionsrubrik" th:if="${!preview.issues().isEmpty()}">Dessa fel hittades</p>
        <ul th:if="${!preview.issues().isEmpty()}">
            <li th:each="issue : ${preview.issues()}" th:text="${issue.message()}"></li>
        </ul>

        <form method="post" th:action="@{/import/commit}">
            <button type="submit">Importera</button>
        </form>
    </div>

    <div class="sammanfattning" th:if="${result != null}">
        <p th:text="|Importerade som nya viner: ${result.imported()}|"></p>
        <p th:text="|Överhoppade: ${result.skipped()}|"></p>
    </div>

    <p class="lank"><a th:href="@{/}">Tillbaka till vinkällaren</a></p>

    <script th:inline="none">
        // Skriver ut vad som valts bredvid respektive knapp - den dolda
        // inputen tog med sig webbläsarens egen "ingen fil vald"-text när
        // den doldes, så utan det här saknas all kvittens. Mappväljaren
        // rapporterar antal filer, inte ett filnamn: den returnerar hela
        // mappens innehåll, och mappnamnet självt finns bara som en
        // sökvägsprefix på varje enskild fil.
        (function () {
            function visaVal(inputId, namnId, beskrivFiler) {
                var input = document.getElementById(inputId);
                var namnRad = document.getElementById(namnId);
                if (!input || !namnRad) {
                    return;
                }
                var ursprungsText = namnRad.textContent;
                input.addEventListener('change', function () {
                    namnRad.textContent = input.files.length
                            ? beskrivFiler(input.files)
                            : ursprungsText;
                });
            }

            visaVal('fil-input', 'fil-namn', function (filer) {
                return filer[0].name;
            });
            visaVal('bilder-input', 'bilder-namn', function (filer) {
                return filer.length === 1 ? '1 fil vald' : filer.length + ' filer valda';
            });
        })();

        // Skalar ner varje vald bild i webbläsaren innan uppladdning -
        // samma Canvas-teknik som etikettskanningen (WINE-5,
        // vin-formular.html), men här över POTENTIELLT MÅNGA filer
        // samtidigt (en hel bildmapp, se webkitdirectory-inputen ovan).
        // Utan detta hade en mapp med ~100 okomprimerade telefonfoton
        // (flera MB styck) krascha mot multipart-storleksgränsen och
        // belasta serverminnet i onödan när filerna mellanlagras inför
        // WINE-25:s commit-steg - se CLAUDE.md/ADR 0014.
        (function () {
            var bilderInput = document.getElementById('bilder-input');
            if (!bilderInput) {
                return;
            }
            var MAX_SIDA = 1600;
            var statusRad = document.getElementById('bilder-status');
            var skickaKnapp = document.getElementById('import-submit');

            function skalaNer(fil) {
                return new Promise(function (resolve) {
                    if (fil.type.indexOf('image/') !== 0) {
                        // Inte en bildfil (t.ex. en systemfil i mappen) - lämna
                        // orörd. Servern ignorerar ändå okända filändelser vid
                        // matchning (se ImageMatcher).
                        resolve(fil);
                        return;
                    }
                    var bild = new Image();
                    var läsare = new FileReader();
                    var behållOrörd = function () {
                        resolve(fil);
                    };
                    // Filändelse per faktiskt returnerad MIME-typ - läses av EFTER
                    // toBlob (se nedan) istället för att antas i förväg, eftersom
                    // vilket format som faktiskt kom tillbaka beror på både
                    // transparensskanningen och webbläsarens WebP-stöd.
                    var ÄNDELSE_PER_MIME = {
                        'image/jpeg': '.jpg',
                        'image/png': '.png',
                        'image/webp': '.webp'
                    };
                    läsare.onload = function (händelse) {
                        bild.onload = function () {
                            var skala = Math.min(1, MAX_SIDA / Math.max(bild.width, bild.height));
                            var duk = document.createElement('canvas');
                            duk.width = Math.round(bild.width * skala);
                            duk.height = Math.round(bild.height * skala);
                            var kontext = duk.getContext('2d');
                            kontext.drawImage(bild, 0, 0, duk.width, duk.height);

                            // WINE-29: JPEG saknar alfakanal, så en bild med
                            // transparent bakgrund tappade sin transparens helt vid
                            // bulkimport. Skanna pixeldatan efter minst ett
                            // alfavärde < 255 - bara DÅ behöver vi ge upp
                            // JPEG-komprimeringen för den här bilden.
                            var pixeldata = kontext.getImageData(0, 0, duk.width, duk.height).data;
                            var harTransparens = false;
                            for (var i = 3; i < pixeldata.length; i += 4) {
                                if (pixeldata[i] < 255) {
                                    harTransparens = true;
                                    break;
                                }
                            }

                            // Transparenta bilder ber om WebP (stöder alfakanal,
                            // komprimerar bättre än PNG) - HTML-specen kräver att en
                            // webbläsare som inte kan koda WebP faller tillbaka till
                            // PNG (aldrig JPEG, aldrig null), så vi läser av blobbens
                            // FAKTISKA typ nedan istället för att anta vilken som kom
                            // tillbaka. Ogenomskinliga bilder är oförändrat JPEG,
                            // exakt som innan den här ändringen.
                            var önskadTyp = harTransparens ? 'image/webp' : 'image/jpeg';

                            duk.toBlob(function (nedskalad) {
                                if (!nedskalad) {
                                    behållOrörd();
                                    return;
                                }
                                // Behåller filnamnets STAM (servern matchar bilder mot
                                // viner via filnamnet, WINE-21) men byter ändelsen till
                                // vad blobben FAKTISKT blev - annars läser ImageMatcher
                                // (som bestämmer MIME-typ utifrån ändelsen, inte
                                // innehållet) fel typ ur en fil vars ändelse inte
                                // stämmer med de faktiska bytesen. Upptäckt av en
                                // riktig webbläsarrundtur (WINE-26, ImportExportFlowIT)
                                // - varken curl-baserad manuell verifiering eller
                                // MockMvc kör JS, så ingen tidigare verifiering kunde
                                // ha avslöjat den ursprungliga varianten av den här
                                // bugen.
                                var stam = fil.name.replace(/\.[^./]+$/, '');
                                var ändelse = ÄNDELSE_PER_MIME[nedskalad.type] || '.jpg';
                                resolve(new File([nedskalad], stam + ändelse, {type: nedskalad.type}));
                            }, önskadTyp, 0.85);
                        };
                        bild.onerror = behållOrörd;
                        bild.src = händelse.target.result;
                    };
                    läsare.onerror = behållOrörd;
                    läsare.readAsDataURL(fil);
                });
            }

            bilderInput.addEventListener('change', function () {
                var valda = Array.prototype.slice.call(bilderInput.files);
                if (valda.length === 0) {
                    return;
                }
                statusRad.textContent = 'Komprimerar ' + valda.length + ' bilder...';
                skickaKnapp.disabled = true;

                Promise.all(valda.map(skalaNer)).then(function (komprimerade) {
                    var överföring = new DataTransfer();
                    komprimerade.forEach(function (f) {
                        överföring.items.add(f);
                    });
                    bilderInput.files = överföring.files;
                    statusRad.textContent = komprimerade.length + ' bilder redo.';
                    skickaKnapp.disabled = false;
                });
            });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontot är klart - Vinkällaren</title>
    <th:block th:replace="~{fragments/tema :: tema}"></th:block>
    <th:block th:replace="~{fragments/inloggningsstil :: inloggningsstil}"></th:block>
</head>
<body>
    <main class="inloggningssida">
        <h1 class="apptitel">Vinkällaren</h1>
        <div class="kort">
            <div class="falt">
                <h2>Ditt konto är klart</h2>
                <p>Din e-postadress är verifierad och ditt lösenord är sparat. Du kan nu logga in.</p>
            </div>
            <div class="falt">
                <a class="knapp knapp-bred" th:href="@{/login}">Till inloggningen</a>
            </div>
        </div>
    </main>
</body>
</html>
